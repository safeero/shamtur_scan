name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Build APK
      run: |
        # العثور على المشروع والانتقال إليه
        PUB_PATH=$(find . -name "pubspec.yaml" -print -quit)
        PROJECT_DIR=$(dirname "$PUB_PATH")
        cd "$PROJECT_DIR"
        
        # ترقية مكتبة البلوتوث لحل مشكلة Gradle نهائياً
        flutter pub add flutter_blue_plus:^2.3.14
        
        # تجديد ملفات الأندرويد لتتوافق مع الإصدار الحديث
        rm -rf android
        flutter create --platforms=android .
        
        # جلب الحزم وبناء التطبيق
        flutter pub get
        flutter build apk --release

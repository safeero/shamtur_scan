name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build APK
      run: |
        # 1. الدخول للمجلد الصحيح
        PUB_PATH=$(find . -name "pubspec.yaml" -print -quit)
        PROJECT_DIR=$(dirname "$PUB_PATH")
        cd "$PROJECT_DIR"
        
        # 2. تنظيف وبناء بيئة أندرويد جديدة
        rm -rf android
        flutter create --platforms=android .
        
        # 3. إنشاء ملف الخصائص يدوياً لمنع أخطاء حزمة البلوتوث
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
        echo "flutter.versionName=1.0.0" >> android/local.properties
        echo "flutter.versionCode=1" >> android/local.properties
        echo "flutter.buildMode=debug" >> android/local.properties
        
        # 4. جلب الحزم وبناء التطبيق
        flutter pub get
        flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: shamtur-scan-app
        path: "**/*.apk"

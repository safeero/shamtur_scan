name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: subosito/flutter-action@v2
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Find Project Root and Build APK
      run: |
        # البحث عن المجلد الذي يحتوي على ملف pubspec.yaml والتوجه إليه تلقائياً
        PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" -maxdepth 3))
        echo "Found project root at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        flutter pub get
        flutter build apk --release

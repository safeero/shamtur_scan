name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'

    - name: Resolve Path, Inject Version & Build APK
      run: |
        PUB_PATH=$(find . -name "pubspec.yaml" -print -quit)
        PROJECT_DIR=$(dirname "$PUB_PATH")
        
        # 1. نقل المشروع بالكامل إلى مجلد آمن لتجنب أخطاء الجرادل مع المسار المخفي (.github)
        SAFE_DIR=$GITHUB_WORKSPACE/safe_build
        mkdir -p $SAFE_DIR
        cp -a "$PROJECT_DIR/." $SAFE_DIR/
        cd $SAFE_DIR
        
        # 2. إضافة سطر الإصدار تلقائياً إذا كان مفقوداً لمنع خطأ (Null Substring)
        if ! grep -q "^version:" pubspec.yaml; then
          echo "version: 1.0.0+1" >> pubspec.yaml
        fi
        
        # 3. ضبط الحزم المتوافقة
        flutter pub add shared_preferences:^2.2.0 printing:^5.12.0
        
        # 4. إعادة إنشاء بيئة أندرويد نظيفة ومستقرة
        rm -rf android
        flutter create --platforms=android .
        
        # 5. جلب الحزم وبناء ملف الـ APK النهائي
        flutter pub get
        flutter build apk --release

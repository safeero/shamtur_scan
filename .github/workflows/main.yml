name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        channel: 'stable'

    - name: Final Resolution & Build APK
      run: |
        PUB_PATH=$(find . -name "pubspec.yaml" -print -quit)
        PROJECT_DIR=$(dirname "$PUB_PATH")
        cd "$PROJECT_DIR"
        
        # 1. إجبار المشروع على استخدام إصدار بلوتوث مستقر لا يسبب أخطاء Gradle الحديثة
        flutter pub add flutter_blue_plus:^1.31.3
        
        # 2. تجديد مجلد الأندرويد ليتوافق مع الإعدادات النظيفة
        rm -rf android
        flutter create --platforms=android .
        
        # 3. جلب الحزم وبناء ملف الـ APK النهائي
        flutter pub get
        flutter build apk --release

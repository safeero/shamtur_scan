name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'
        channel: 'stable'

    - name: Locate, Repair, Upgrade and Build APK
      run: |
        PUB_PATH=$(find . -name "pubspec.yaml" -print -quit)
        if [ -z "$PUB_PATH" ]; then
          echo "Error: pubspec.yaml not found!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$PUB_PATH")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # 1. تحديث وإصلاح ملفات الأندرويد
        flutter create .
        
        # 2. الترقية الإجبارية لجميع الحزم لأحدث إصدار متوافق لحل أخطاء Gradle
        flutter pub upgrade --major-versions
        
        # 3. بناء ملف الـ APK النهائي
        flutter build apk --release

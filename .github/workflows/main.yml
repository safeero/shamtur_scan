name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 11 (متوافق مع Gradle القديم لمشروعك)
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Set up Flutter 3.13.9 (البيئة الأصلية المستقرة لمشروعك)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.9'
        channel: 'stable'

    - name: Build APK directly
      run: |
        PUB_PATH=$(find . -name "pubspec.yaml" -print -quit)
        PROJECT_DIR=$(dirname "$PUB_PATH")
        cd "$PROJECT_DIR"
        
        # إعادة الاعتمادات لنسخها المستقرة التي لا تسبب أخطاء
        flutter pub add shared_preferences:^2.2.0 printing:^5.11.1
        
        flutter pub get
        flutter build apk --release

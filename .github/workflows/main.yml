name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        channel: 'stable'

    - name: Final Fix & Build APK
      run: |
        PUB_PATH=$(find . -name "pubspec.yaml" -print -quit)
        PROJECT_DIR=$(dirname "$PUB_PATH")
        cd "$PROJECT_DIR"
        
        # 1. حذف ملف القفل القديم لإجبار النظام على جلب النسخ الصحيحة
        rm -f pubspec.lock
        
        # 2. استخدام الإصدار الصحيح والموجود فعلياً للبلوتوث والذي يدعم فلاتر 3.24
        flutter pub add flutter_blue_plus:^2.3.14
        
        # 3. إعادة إنشاء مجلد أندرويد متوافق ونظيف
        rm -rf android
        flutter create --platforms=android .
        
        # 4. جلب الحزم وبناء الـ APK بنجاح
        flutter pub get
        flutter build apk --release

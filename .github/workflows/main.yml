name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'

    - name: Resolve Dependency Hell and Build APK
      run: |
        PUB_PATH=$(find . -name "pubspec.yaml" -print -quit)
        if [ -z "$PUB_PATH" ]; then
          echo "Error: pubspec.yaml not found!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$PUB_PATH")
        cd "$PROJECT_DIR"
        
        # 1. إجبار المشروع على استخدام إصدارات متوافقة تماماً مع فلاتر 3.19.6
        flutter pub add shared_preferences:^2.2.0 printing:^5.12.0
        
        # 2. حذف مجلد الأندرويد القديم بالكامل لتجنب أخطاء Gradle
        rm -rf android
        
        # 3. إنشاء مجلد أندرويد نظيف وجديد
        flutter create --platforms=android .
        
        # 4. جلب الحزم وبناء ملف الـ APK النهائي
        flutter pub get
        flutter build apk --release

name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6' # إصدار مستقر يتوافق تماماً مع مجلد الأندرويد لديك
        channel: 'stable'

    - name: Fix Dependencies and Build APK
      run: |
        PUB_PATH=$(find . -name "pubspec.yaml" -print -quit)
        if [ -z "$PUB_PATH" ]; then
          echo "Error: pubspec.yaml not found!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$PUB_PATH")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # تخفيض هذه الحزمة فقط برمجياً لتجنب الحاجة لفلاتر 3.24
        flutter pub add shared_preferences:^2.2.0
        
        flutter pub get
        flutter build apk --release

name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        channel: 'stable'

    - name: Clean Cache and Build APK
      run: |
        PUB_PATH=$(find . -name "pubspec.yaml" -print -quit)
        PROJECT_DIR=$(dirname "$PUB_PATH")
        cd "$PROJECT_DIR"
        
        # 1. تدمير ملف القفل القديم لإجبار النظام على التخلص من النسخ المكسورة
        rm -f pubspec.lock
        
        # 2. تنظيف كاش الـ pub لتفريغ أي مخلفات قديمة
        flutter pub cache clean -f
        
        # 3. إعادة إنشاء مجلد أندرويد نظيف متوافق مع Gradle الحديث
        rm -rf android
        flutter create --platforms=android .
        
        # 4. جلب الحزم النظيفة وبناء الـ APK النهائي
        flutter pub get
        flutter build apk --release

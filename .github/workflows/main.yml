name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    # إذا كان مشروعك موجوداً في مجلد فرعي، استبدل "." باسم المجلد (مثلاً: subfolder)
    # أما إذا كان مشروعك في الجذر ولكن مفقود، فتأكد أن ملف pubspec.yaml مرفوع في مستودع GitHub
    - name: Install Dependencies
      run: flutter pub get
      working-directory: . 

    - name: Build APK
      run: flutter build apk --release
      working-directory: .
